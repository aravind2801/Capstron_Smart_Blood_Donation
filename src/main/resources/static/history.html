<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
    <div id="navbarSlot"></div>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h1 class="section-title mb-0"><i class="bi bi-clock-history me-2 text-danger-700"></i>Donation History</h1>
                <p class="text-muted mb-0">Every request and completed donation, saved permanently.</p>
            </div>
            <button class="btn btn-outline-danger" id="exportPdfBtn">
                <i class="bi bi-file-earmark-pdf-fill me-1"></i>Export PDF
            </button>
        </div>

        <div class="card-lifelink p-3 mb-4">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="historyStatus">
                        <option value="">All statuses</option>
                        <option>PENDING</option>
                        <option>ACCEPTED</option>
                        <option>COMPLETED</option>
                        <option>REJECTED</option>
                        <option>CANCELLED</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Search</label>
                    <input type="text" class="form-control" id="historySearch" placeholder="Search patient, donor, hospital, blood group...">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-lifelink w-100" id="historySearchBtn"><i class="bi bi-search me-1"></i>Filter</button>
                </div>
            </div>
        </div>

        <div class="card-lifelink p-0 overflow-hidden">
            <div class="table-responsive table-responsive-lg-sm">
                <table class="table table-lifelink align-middle">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Blood Group</th>
                            <th>Patient</th>
                            <th>Donor</th>
                            <th>Hospital</th>
                            <th>Status</th>
                            <th>My Role</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </div>
        <div class="mt-4" id="historyPagination"></div>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <p class="mb-0 small">LifeLink - Smart Blood Donation Network</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
