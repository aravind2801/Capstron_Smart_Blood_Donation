<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
    <div id="navbarSlot"></div>

    <main class="container py-4">
        <h1 class="section-title mb-4"><i class="bi bi-shield-lock-fill me-2 text-danger-700"></i>Admin Dashboard</h1>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-card"><div class="stat-icon" style="background:var(--red-100);color:var(--red-700)"><i class="bi bi-people-fill"></i></div>
                    <div><div class="stat-value" id="statUsers">0</div><div class="stat-label">Users</div></div></div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-card"><div class="stat-icon" style="background:var(--red-100);color:var(--red-700)"><i class="bi bi-heart-pulse-fill"></i></div>
                    <div><div class="stat-value" id="statDonors">0</div><div class="stat-label">Donors</div></div></div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-card"><div class="stat-icon" style="background:var(--blue-bg);color:var(--blue)"><i class="bi bi-hospital-fill"></i></div>
                    <div><div class="stat-value" id="statPatients">0</div><div class="stat-label">Patients</div></div></div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-card"><div class="stat-icon" style="background:var(--green-bg);color:var(--green)"><i class="bi bi-check2-circle"></i></div>
                    <div><div class="stat-value" id="statActiveDonors">0</div><div class="stat-label">Active Donors</div></div></div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-card"><div class="stat-icon" style="background:var(--amber-bg);color:var(--amber)"><i class="bi bi-hourglass-split"></i></div>
                    <div><div class="stat-value" id="statPending">0</div><div class="stat-label">Pending</div></div></div>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <div class="stat-card"><div class="stat-icon" style="background:var(--purple-bg);color:var(--purple)"><i class="bi bi-droplet-fill"></i></div>
                    <div><div class="stat-value" id="statCompleted">0</div><div class="stat-label">Donations</div></div></div>
            </div>
        </div>

        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="usersTabBtn" data-bs-toggle="tab" data-bs-target="#usersPane" type="button" role="tab"><i class="bi bi-people me-1"></i>Users</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="requestsTabBtn" data-bs-toggle="tab" data-bs-target="#requestsPane" type="button" role="tab"><i class="bi bi-clipboard2-heart me-1"></i>Requests</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="historyTabBtn" data-bs-toggle="tab" data-bs-target="#historyPane" type="button" role="tab"><i class="bi bi-clock-history me-1"></i>History</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="usersPane" role="tabpanel">
                <div class="card-lifelink p-3 mb-3">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <select class="form-select" id="usersRole">
                                <option value="">All roles</option>
                                <option>DONOR</option>
                                <option>PATIENT</option>
                                <option>ADMIN</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="usersSearch" placeholder="Search name, email, phone, city...">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-lifelink w-100" id="usersSearchBtn"><i class="bi bi-search me-1"></i>Filter</button>
                        </div>
                    </div>
                </div>
                <div class="card-lifelink p-0 overflow-hidden">
                    <div class="table-responsive table-responsive-lg-sm">
                        <table class="table table-lifelink align-middle">
                            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Blood</th><th>City</th><th>Available</th><th>Joined</th></tr></thead>
                            <tbody id="usersBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="mt-3" id="usersPagination"></div>
            </div>

            <div class="tab-pane fade" id="requestsPane" role="tabpanel">
                <div class="card-lifelink p-3 mb-3">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <select class="form-select" id="requestsStatus">
                                <option value="">All statuses</option>
                                <option>PENDING</option><option>ACCEPTED</option><option>COMPLETED</option>
                                <option>REJECTED</option><option>CANCELLED</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="requestsSearch" placeholder="Search patient, donor, hospital, group...">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-lifelink w-100" id="requestsSearchBtn"><i class="bi bi-search me-1"></i>Filter</button>
                        </div>
                    </div>
                </div>
                <div class="card-lifelink p-0 overflow-hidden">
                    <div class="table-responsive table-responsive-lg-sm">
                        <table class="table table-lifelink align-middle">
                            <thead><tr><th>ID</th><th>Blood</th><th>Patient</th><th>Donor</th><th>Hospital</th><th>Units</th><th>Status</th><th>Created</th></tr></thead>
                            <tbody id="requestsBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="mt-3" id="requestsPagination"></div>
            </div>

            <div class="tab-pane fade" id="historyPane" role="tabpanel">
                <div class="card-lifelink p-3 mb-3">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <select class="form-select" id="historyStatus2">
                                <option value="">All statuses</option>
                                <option>PENDING</option><option>ACCEPTED</option><option>COMPLETED</option>
                                <option>REJECTED</option><option>CANCELLED</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="historySearch2" placeholder="Search patient, donor, hospital...">
                        </div>
                        <div class="col-md-2 d-flex gap-1">
                            <button class="btn btn-lifelink w-100" id="historySearchBtn2"><i class="bi bi-search me-1"></i>Filter</button>
                            <button class="btn btn-outline-danger" id="adminExportPdf" title="Export PDF"><i class="bi bi-file-earmark-pdf-fill"></i></button>
                        </div>
                    </div>
                </div>
                <div class="card-lifelink p-0 overflow-hidden">
                    <div class="table-responsive table-responsive-lg-sm">
                        <table class="table table-lifelink align-middle">
                            <thead><tr><th>Date</th><th>Blood</th><th>Patient</th><th>Donor</th><th>Hospital</th><th>Status</th></tr></thead>
                            <tbody id="historyBody2"></tbody>
                        </table>
                    </div>
                </div>
                <div class="mt-3" id="historyPagination2"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <p class="mb-0 small">LifeLink - Smart Blood Donation Network</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
