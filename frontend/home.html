<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
    <div id="navbarSlot"></div>

    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h1 class="section-title mb-0" id="greeting">Welcome</h1>
                <p class="text-muted mb-0" id="userLine">Your dashboard</p>
            </div>
            <div class="d-flex gap-2">
                <div class="form-check form-switch d-none" id="availToggleWrap">
                    <input class="form-check-input" type="checkbox" role="switch" id="availToggle">
                    <label class="form-check-label" for="availToggle" id="availLabel">Available</label>
                </div>
                <button class="btn btn-lifelink" id="newRequestBtn">
                    <i class="bi bi-plus-circle me-1"></i>New Blood Request
                </button>
            </div>
        </div>

        <div class="reminder-banner d-none mb-4" id="reminderBanner">
            <i class="bi bi-exclamation-triangle-fill fs-4"></i>
            <div>
                It has been more than 90 days since your last donation.
                <a href="profile.html" class="text-white text-decoration-underline fw-bold">Update your status</a>.
            </div>
        </div>

        <div class="card-lifelink p-3 p-md-4 mb-4">
            <div class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Blood Group</label>
                    <select class="form-select" id="homeBloodGroup">
                        <option value="">All blood groups</option>
                        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Location</label>
                    <div class="input-group">
                        <button class="btn btn-lifelink-soft" type="button" id="homeLocateBtn"><i class="bi bi-crosshair"></i></button>
                        <input class="form-control" id="homeLocText" placeholder="Your location" readonly>
                    </div>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-lifelink w-100" id="homeSearchBtn">
                        <i class="bi bi-search me-1"></i>Search Donors
                    </button>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 fw-bold mb-0"><i class="bi bi-people-fill me-2 text-danger-700"></i>Nearby Donors</h2>
            <span class="text-muted small" id="homeResultInfo"></span>
        </div>
        <div class="row g-3" id="donorGrid"></div>
        <div class="mt-4" id="homePagination"></div>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <p class="mb-0 small">LifeLink - Smart Blood Donation Network</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/donors.js"></script>
    <script src="js/request.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
