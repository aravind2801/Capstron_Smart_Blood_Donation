<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Donors - LifeLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
    <div id="navbarSlot"></div>

    <main class="container py-4">
        <h1 class="section-title"><i class="bi bi-search me-2 text-danger-700"></i>Find Blood Donors</h1>
        <p class="section-subtitle">Available donors are ranked nearest-first, same city before nearby districts.</p>

        <div class="card-lifelink p-3 p-md-4 mb-4">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Blood Group</label>
                    <select class="form-select" id="searchBloodGroup">
                        <option value="">All blood groups</option>
                        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Location</label>
                    <div class="input-group">
                        <button class="btn btn-lifelink-soft" type="button" id="searchLocateBtn"><i class="bi bi-crosshair"></i></button>
                        <input class="form-control" id="searchLocText" placeholder="Your location" readonly>
                        <button class="btn btn-outline-secondary" type="button" id="searchClearLoc" title="Clear location">&times;</button>
                    </div>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-lifelink w-100" id="searchBtn">
                        <i class="bi bi-search me-1"></i>Search
                    </button>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 fw-bold mb-0">Results</h2>
            <span class="text-muted small" id="searchResultInfo"></span>
        </div>
        <div class="row g-3" id="searchGrid"></div>
        <div class="mt-4" id="searchPagination"></div>
    </main>

    <footer class="site-footer text-center">
        <div class="container">
            <p class="mb-0 small">LifeLink - Smart Blood Donation Network</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/donors.js"></script>
    <script src="js/request.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
