# =========================================================================
# LifeLink - application configuration
# =========================================================================

# --- Server --------------------------------------------------------------
# Port 8080 is used by another service on this machine, so LifeLink runs on 8081.
server.port=8081
server.error.include-message=never

# --- Database (MySQL 8, local instance on port 3306) --------------------
# Docker alternative: `docker compose up -d` exposes MySQL on host port 3307;
# swap the URL below to jdbc:mysql://localhost:3307/lifelink if you use it.
spring.datasource.url=jdbc:mysql://localhost:3306/lifelink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=lifelink
spring.datasource.password=lifelink123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate -----------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# --- Flyway (schema is versioned in src/main/resources/db/migration) -----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- Multipart (profile photo upload) ------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- JWT -----------------------------------------------------------------
# Base64-encoded HS256 key (>= 32 bytes decoded). Override via APP_JWT_SECRET.
app.jwt.secret=dbiZrAqkpmd0oL5j9Kcuxc5IKyRe+sR2909PIPe06NaMU9XrfwPfDVuc66PT5mKX
app.jwt.expiration-ms=86400000
app.jwt.remember-ms=604800000
app.jwt.issuer=lifelink

# --- Frontend base URL (used in emailed links) ---------------------------
app.frontend-url=http://localhost:8081

# --- Email ---------------------------------------------------------------
# Set APP_EMAIL_ENABLED=true and provide SMTP credentials to send real mail.
# When false, every email is written to the application log instead.
app.email.enabled=false
app.email.from=LifeLink <no-reply@lifelink.local>

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- App behaviour -------------------------------------------------------
# Maximum notification distance in km (Haversine). Override via APP_MAX_DISTANCE_KM.
app.max-distance-km=15

# --- Logging -------------------------------------------------------------
logging.level.root=INFO
logging.level.com.lifelink=INFO
logging.file.name=logs/lifelink.log
logging.file.max-size=10MB
logging.file.max-history=7
