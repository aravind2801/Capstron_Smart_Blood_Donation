services:
  mysql:
    image: mysql:8.0
    container_name: lifelink-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: lifelink
      MYSQL_USER: lifelink
      MYSQL_PASSWORD: lifelink123
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - lifelink-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  lifelink-mysql-data:
